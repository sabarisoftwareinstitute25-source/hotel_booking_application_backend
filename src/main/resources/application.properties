# Mobile App Backend API Configuration
# This is a REST API backend for Android/iOS mobile applications
spring.application.name=mobileapp

# Server Configuration - REST API for mobile apps
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/hotelbooking-app
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.initialization-fail-timeout=-1
# Allow application to start even if database connection fails initially
spring.datasource.continue-on-error=false
# Increase validation timeout
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA/Hibernate  Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
# Prevent Hibernate from using JDK metadata defaults (can cause startup issues)
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
# Allow lazy initialization to prevent startup failures
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Fix for PostgreSQL schema creation
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.hbm2ddl.auto=update
# Handle case sensitivity for PostgreSQL
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# Jackson/JSON Configuration
spring.jackson.time-zone=UTC
# Note: write-dates-as-timestamps is deprecated in Jackson 3.x
# Dates are now serialized as ISO-8601 strings by default, which is the desired behavior

# Debug Mode - Enable to see detailed error information
# Set to true to see condition evaluation report
debug=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
logging.level.com.hotelbooking.mobileapp=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.org.springframework.context=DEBUG
logging.level.org.springframework.beans=DEBUG

#forgotten password
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mvc.trailing-slash-match=true